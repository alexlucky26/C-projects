name: 'C++ CI'

on:
  push:
    branches:
      - main
      - bulk_server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ curl zip unzip tar

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> $GITHUB_ENV

      - name: Install vcpkg dependencies
        run: |
          ./vcpkg/vcpkg install boost-filesystem boost-asio

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DPATCH_VERSION=${{ github.run_number }}

      - name: Build
        run: cmake --build build

      - name: List built binaries
        run: ls -l build/bin || true

      - name: Package
        run: cmake --build build --target package

      - name: Find .deb file
        id: find_deb
        run: |
          DEB_FILE=$(find build -name "*.deb" | head -n 1)
          if [[ -z "${DEB_FILE}" ]]; then
            echo "Error: .deb file not found!"
            exit 1
          fi
          echo "DEB_FILE=${DEB_FILE}" | tee output.txt
          echo "DEB_FILE=${DEB_FILE}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        with:
          tag_name: ${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_deb.outputs.DEB_FILE }}
          asset_name: bulk_server_cli-0.0.${{ github.run_number }}-Linux.deb
          asset_content_type: application/vnd.debian.binary-package